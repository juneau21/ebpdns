<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark light">
<!-- CSP: 同源脚本(app.js / echarts.min.js) + 内联样式; WASM 需 wasm-unsafe-eval。
     frame-ancestors 由后端 HTTP 响应头投递(meta 不允许投递 frame-ancestors)。 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'">
<title>ebpdns · eBPF 版 SmartDNS 解析器控制台 (Debian 部署版)</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/style.css">
<!-- v2.1.7 首屏引导屏: 内联关键样式, 在 WASM(app.js/app_bg.wasm ~数百 KB) 下载解析完成前
     就有可见内容, 显著改善首帧(FCP)与「白屏等待」的体感; WASM 就绪首帧后由脚本移除。 -->
<style>
  #boot{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;
        gap:14px;background:#070b10;color:#93a2b3;
        font-family:"Space Grotesk","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
  #boot .bmark{width:38px;height:38px;color:#2ee6c8;animation:bspin 1.2s linear infinite}
  #boot .btxt{font-size:13px;letter-spacing:.4px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
  #boot .bbar{width:180px;height:3px;border-radius:3px;background:#1d2938;overflow:hidden}
  #boot .bbar i{display:block;height:100%;width:40%;background:linear-gradient(90deg,#2ee6c8,#5b8def);animation:bslide 1.1s ease-in-out infinite}
  @keyframes bspin{to{transform:rotate(360deg)}}
  @keyframes bslide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
  @media (prefers-reduced-motion: reduce){#boot .bmark,#boot .bbar i{animation:none}}
</style>
<!-- Web 控制台图表沿用 v1.9.162 的 ECharts 5（同源静态文件，无外部 CDN）。 -->
<script src="/echarts.min.js"></script>
</head>
<body>
  <div id="boot" role="status" aria-live="polite">
    <svg class="bmark" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.2">
      <path d="M8 6h24v28H8z"></path>
      <path d="M14 14h12M14 20h12M14 26h8"></path>
      <circle cx="30" cy="30" r="6" fill="#070b10" stroke="currentColor"></circle>
    </svg>
    <div class="btxt">正在加载 ebpdns 控制台…</div>
    <div class="bbar"><i></i></div>
  </div>
  <noscript>
    <div style="padding:20px;color:#ffb454">本控制台由 Rust→WASM 渲染，需要启用 JavaScript 与 WebAssembly。</div>
  </noscript>
  <script>
    // 首屏指标（页脚 #boot-ms 展示）：t0=本脚本执行时刻；first_paint=引导屏首帧；
    // interactive=WASM 挂载后的首帧（由下方 module 脚本在 rAF 中写入）。
    window.__ebpdns_boot = { t0: performance.now(), first_paint: 0, interactive: 0 };
    requestAnimationFrame(function () {
      var b = window.__ebpdns_boot;
      if (!b.first_paint) { b.first_paint = performance.now(); }
    });
  </script>
  <!-- Leptos CSR：Rust→WASM 渲染整棵 DOM 树到 body（结构与样式完全对齐 v1.9.162 web/index.html）。 -->
  <script type="module">
    import init from './app.js';
    init().then(() => {
      requestAnimationFrame(() => {
        const b = window.__ebpdns_boot || {};
        b.interactive = performance.now();
        const el = document.getElementById('boot');
        if (el) { el.remove(); }
      });
    }).catch((e) => {
      const el = document.getElementById('boot');
      if (el) { el.remove(); }
      document.body.innerHTML = '<pre style="color:#ff6b5e;padding:20px">WASM 初始化失败: ' + e + '</pre>';
    });
  </script>
</body>
</html>
