[package]
name = "ebpdns"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "ebpdns 命令行与守护进程"

[[bin]]
name = "ebpdns"
path = "src/main.rs"

[dependencies]
ebpdns-fs = { workspace = true }
ebpdns-resolver = { workspace = true }
ebpdns-server = { workspace = true }
ebpdns-cache = { workspace = true }
ebpdns-rules = { workspace = true }
ebpdns-upstream = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
parking_lot = { workspace = true }

[features]
default = []
embed-frontend = ["ebpdns-server/embed-frontend"]
