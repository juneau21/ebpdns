[workspace]
resolver = "2"
# web/ 为 WASM 前端独立 crate（wasm-only 依赖），不进 native 构建。
exclude = ["web"]
members = [
    "crates/ebpdns-fs",
    "crates/ebpdns-proto",
    "crates/ebpdns-cache",
    "crates/ebpdns-rules",
    "crates/ebpdns-upstream",
    "crates/ebpdns-resolver",
    "crates/ebpdns-server",
    "crates/ebpdns",
]

[workspace.package]
# **版本单一来源（2.1.19）**：全树版本位点都从这里收敛 —— 后端经
# `ebpdns-server/src/api.rs` 的 `env!("CARGO_PKG_VERSION")` 直接读本字段；
# 前端经 `web/build.rs` 解析本文件注入 `EBPDNS_VERSION`（页脚 / 关于页共用）。
# 其余位置（systemd Description、Makefile PKG、README、packaging/install.sh、
# 包内目录名）必须与本值一致，见 README「版本」一节。
version = "2.1.49"
edition = "2021"
rust-version = "1.99"
license = "GPL-3.0-or-later"
authors = ["ebpdns"]
repository = "local://ebpdns"

[workspace.dependencies]
# 内部 crate（与本 workspace 同版本：历史上写死 2.0.0 造成版本串漂移）
ebpdns-fs = { path = "crates/ebpdns-fs", version = "2.1.29" }
ebpdns-proto = { path = "crates/ebpdns-proto", version = "2.1.29" }
ebpdns-cache = { path = "crates/ebpdns-cache", version = "2.1.29" }
ebpdns-rules = { path = "crates/ebpdns-rules", version = "2.1.29" }
ebpdns-upstream = { path = "crates/ebpdns-upstream", version = "2.1.29" }
ebpdns-resolver = { path = "crates/ebpdns-resolver", version = "2.1.29" }
ebpdns-server = { path = "crates/ebpdns-server", version = "2.1.29" }

# 异步运行时
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# HTTP / 服务端
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "tokio", "json", "query", "form", "ws", "macros", "matched-path"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
tower = { version = "0.5", features = ["util", "timeout", "limit", "load-shed"] }
tower-http = { version = "0.6", features = ["fs", "trace", "cors", "set-header", "compression-gzip"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots-ring"] }

# TLS / QUIC（统一 ring 提供者，构建更稳；2 核）
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "logging", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls-pemfile = "2"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
webpki-roots = "0.26"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 基础工具
bytes = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
clap = { version = "4", features = ["derive", "env"] }
regex = "1"
once_cell = "1"
lru = "0.12"
dashmap = "6"
parking_lot = "0.12"
rand = "0.8"
hex = "0.4"
url = "2"
rust-embed = { version = "8", features = ["mime-guess", "interpolate-folder-path"] }
mime_guess = "2"
num_cpus = "1"
socket2 = "0.5"
hickory-proto = { version = "0.25", default-features = false }

# 前端（WASM）
leptos = { version = "0.7", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
js-sys = "0.3"
gloo-net = { version = "0.6", features = ["http", "websocket"] }
console_error_panic_hook = "0.1"
console_log = "1"

# 测试/基准
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
opt-level = 3
debug = false
lto = "thin"
codegen-units = 1
panic = "unwind"
incremental = false

[profile.release-patched]
inherits = "release"

# 开发期更快编译
[profile.dev]
opt-level = 0
debug = 1
incremental = true
